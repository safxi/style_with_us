name: style_with_us
description: A premium fashion-tech app with AI-powered styling recommendations.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.0.0

  # Networking (Required for AI APIs)
  dio: ^5.4.0

  # UI & Animations (Keep it controlled)
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # Image & Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  camera: ^0.10.5+9
  permission_handler: ^11.3.0

  # Icons
  flutter_svg: ^2.0.9
  phosphor_flutter: ^2.0.1

  # Layout & Responsiveness
  flutter_screenutil: ^5.9.0
  pull_to_refresh: ^2.0.0
  smooth_page_indicator: ^1.1.0

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.3
  uuid: ^4.3.3
  http: ^1.6.0
  flutter_stripe: ^10.1.0
  flutter_dotenv: ^5.1.0
  fl_chart: ^0.65.0
  shared_preferences: ^2.5.5
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700