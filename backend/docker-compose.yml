version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql+psycopg://style_user:style_password@db:5432/style_with_us
      - REDIS_URL=redis://redis:6379/0
      - STRIPE_API_KEY=sk_test_change_me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg://style_user:style_password@db:5432/style_with_us
      - REDIS_URL=redis://redis:6379/0
      - STRIPE_API_KEY=sk_test_change_me
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: style_user
      POSTGRES_PASSWORD: style_password
      POSTGRES_DB: style_with_us
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U style_user -d style_with_us" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: style_user
      POSTGRES_PASSWORD: style_password
      POSTGRES_DB: style_with_us
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db_backups:/backups
    entrypoint: |
      /bin/sh -c '
      while true; do
        echo "Running daily pg_dump backup..."
        pg_dump -h db -U style_user style_with_us > /backups/backup_$$(date +%Y%m%d).sql
        sleep 86400
      done
      '
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
